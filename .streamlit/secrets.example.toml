# Modele pour les secrets Streamlit Cloud (Settings > Secrets)
# ou pour un fichier local .streamlit/secrets.toml (ignore par git).

[cookie]
name = "prayer_app_cookie"
key = "<chaine aleatoire longue>"
expiry_days = 1

[credentials.usernames.admin]
email = "admin@example.com"
name = "Administrateur"
password = "<hash bcrypt>"

[credentials.usernames.utilisateur]
email = "user@example.com"
name = "Utilisateur"
password = "<hash bcrypt>"
